name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: test (Elixir ${{ matrix.elixir }}, OTP ${{ matrix.otp }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Below 1.18 the build has no Igniter: proves the library and its
          # tests need none.
          - elixir: "1.17.3"
            otp: "27.3"
            no_igniter: true
          - elixir: "1.18.4"
            otp: "27.3"
          - elixir: "1.19.5"
            otp: "28.3"
          - elixir: "1.20.3"
            otp: "29.0.5"
            lint: true
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          version-type: strict
      # deps, _build and the Hex cache, per matrix row and lock. The child
      # projects of the integration tests seed their private HEX_HOME from
      # ~/.hex, so a warm cache also spares them hex.pm.
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            ~/.hex
          key: ${{ runner.os }}-elixir-${{ matrix.elixir }}-otp-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-elixir-${{ matrix.elixir }}-otp-${{ matrix.otp }}-
      - run: mix deps.get
      # Formatting and Credo follow the newest Elixir; older formatters and
      # Credo's checks for them would disagree with it.
      - if: matrix.lint
        run: mix format --check-formatted
      - if: matrix.lint
        run: mix credo --strict
      - run: mix compile --warnings-as-errors
      - if: matrix.no_igniter
        name: no Igniter in the build; the installer task says what to do instead
        run: |
          mix deps > deps.txt
          # Not `! grep`: bash -e ignores a negated command's status.
          if grep -q igniter deps.txt; then echo "igniter is a dependency below 1.18"; exit 1; fi
          mix precompiled.install > install.txt 2>&1
          grep -q "runs through Igniter" install.txt
      - run: mix test
      # The device layer must run in a release without Mix: nothing it
      # reaches may call Mix or Hex (scripts/mix_free_check.exs).
      - if: matrix.lint
        name: device layer is Mix-free
        run: |
          MIX_ENV=prod mix compile
          elixir scripts/mix_free_check.exs _build/prod/lib/precompiled/ebin
      # Child Mix projects against the local fixture (plain, umbrella, alias
      # order, a git dependency, Mix.install/2, and from 1.18 the Igniter
      # installer): the deps.loadpaths alias on each Mix in the range.
      # Children fetch from hex.pm into a private HEX_HOME.
      - run: mix test --only integration
      - if: matrix.lint
        run: MIX_ENV=prod mix archive.build -o /tmp/precompiled.ez
  chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix deps.get
      - run: mix credo --strict --config-name chain
      - name: harness format, compile, tests
        working-directory: integration/chain
        run: |
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix test
      - run: mix archive.install hex nerves_bootstrap --force
      # nerves_uevent compiles a host NIF against libmnl.
      - run: sudo apt-get update && sudo apt-get install -y libmnl-dev
      - name: fixture tests (host)
        working-directory: integration/chain/fixture
        run: |
          mix deps.get
          mix test
